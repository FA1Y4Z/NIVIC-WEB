spring.application.name=NIVIC

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

server.port=${PORT:8080}
server.address=0.0.0.0

# Configuração do pool de conexões
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Tempo máximo de vida de uma conexão: 5 minutos
spring.datasource.hikari.max-lifetime=300000

# Verifica conexões ociosas a cada 2 minutos
spring.datasource.hikari.keepalive-time=120000

# Tempo máximo de inatividade
spring.datasource.hikari.idle-timeout=180000

# Timeout para obter uma conexão
spring.datasource.hikari.connection-timeout=30000

# Timeout para validar uma conexão
spring.datasource.hikari.validation-timeout=5000
